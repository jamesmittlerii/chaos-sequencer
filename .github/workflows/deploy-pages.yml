name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Stamp deployment build
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          python3 << 'PY'
          import os
          import re
          import sys
          from pathlib import Path

          sha = os.environ["FULL_SHA"][:7]
          html_path = Path("dist/index.html")
          html = html_path.read_text()
          html = re.sub(
              r'(<meta name="lorenz-build" content=")[^"]+(")',
              rf"\g<1>{sha}\g<2>",
              html,
              count=1,
          )
          html = re.sub(
              r'(id="buildStamp"[^>]*>)[^<]+',
              rf"\g<1>{sha}",
              html,
              count=1,
          )
          if "<!DOCTYPE html>" not in html or 'rel="stylesheet"' not in html:
              sys.exit("stamp produced invalid HTML")
          html_path.write_text(html)
          print(f"prepared build {sha}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
