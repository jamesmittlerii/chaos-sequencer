name: Stamp build

on:
  push:
    branches: [main]

jobs:
  stamp:
    if: ${{ !startsWith(github.event.head_commit.message, 'Stamp build ') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write commit id into the page
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          python3 << 'PY'
          import os, re, sys
          from pathlib import Path

          sha = os.environ["FULL_SHA"][:7]
          html_path = Path("index.html")
          html = html_path.read_text()
          original = html
          # \g<1> is required: \171 would be parsed as octal 'y' when the SHA starts with 7.
          html = re.sub(
              r'(<meta name="lorenz-build" content=")[^"]+(")',
              rf"\g<1>{sha}\g<2>",
              html,
              count=1,
          )
          html = re.sub(r"(\?v=)[A-Za-z0-9_-]+", rf"\g<1>{sha}", html)
          html = re.sub(
              r'(id="buildStamp"[^>]*>)[^<]+',
              rf"\g<1>{sha}",
              html,
              count=1,
          )
          if "<!DOCTYPE html>" not in html or 'rel="stylesheet"' not in html:
              sys.exit("stamp produced invalid HTML")
          if html == original:
              print("already stamped")
          else:
              html_path.write_text(html)
              print(f"stamped {sha}")
          PY

      - name: Commit stamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "already stamped"
            exit 0
          fi
          git commit -m "Stamp build ${GITHUB_SHA:0:7}"
          git push
