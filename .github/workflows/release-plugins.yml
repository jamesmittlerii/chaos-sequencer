# Notarized macOS installer (Audio Unit and VST3) and an unsigned Windows VST3 installer.
#
# Runs on version tags (v1.2.3) and from the Actions tab. The tag name, without
# the leading v, is the installer version.
#
# Repository secrets:
#
#   MACOS_CERTIFICATE_P12_BASE64
#     Developer ID certificate exported as a .p12, then base64. The file must
#     contain both "Developer ID Application" and "Developer ID Installer".
#   MACOS_CERTIFICATE_PASSWORD
#     Password for that .p12.
#   APPLE_TEAM_ID
#     Ten-character Apple Developer team id.
#   APPLE_API_KEY_ID
#   APPLE_API_ISSUER_ID
#   APPLE_API_KEY_BASE64
#     App Store Connect API key (.p8) used by notarytool, base64-encoded.
#     The key needs access to notarization for APPLE_TEAM_ID.

name: Release plugins

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plugins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS installer
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Require signing secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Version
        id: version
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME#v}"
          if [[ ! "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ref="1.0.0"
          fi
          echo "value=$ref" >> "$GITHUB_OUTPUT"

      - name: Build Audio Unit and VST3
        run: |
          set -euo pipefail
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release \
            -DLORENZ_VERSION="${{ steps.version.outputs.value }}" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"
          cmake --build plugin/build --config Release --parallel 4 \
            --target LorenzMIDI_AU --target LorenzMIDI_VST3 --target lorenz_engine_test
          plugin/build/lorenz_engine_test

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        # S2068: keychain password is generated below; the .p12 password is a GitHub secret.
        run: | # NOSONAR
          set -euo pipefail
          cert="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/lorenz-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | tr -d '[:space:]' | base64 -D > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          curl --proto '=https' --proto-redir '=https' -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl --proto '=https' --proto-redir '=https' -fsSL -o "$RUNNER_TEMP/DeveloperIDCA.cer" https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          import_ca() {
            local output
            if output=$(security import "$1" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/productbuild 2>&1); then
              printf '%s\n' "$output"
              return 0
            fi
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -q "already exists"; then
              return 0
            fi
            return 1
          }
          import_ca "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          import_ca "$RUNNER_TEMP/DeveloperIDCA.cer"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"
          security find-identity -v -p basic "$keychain"

      - name: Notarize and package
        env:
          LORENZ_VERSION: ${{ steps.version.outputs.value }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          identities="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH"; security find-identity -v -p basic "$KEYCHAIN_PATH")"
          app_id="$(printf '%s\n' "$identities" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          installer_id="$(printf '%s\n' "$identities" | sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' | head -1)"
          if [ -z "$app_id" ] || [ -z "$installer_id" ]; then
            echo "The .p12 needs both a Developer ID Application certificate and a Developer ID Installer certificate."
            printf '%s\n' "$identities"
            exit 1
          fi
          case "$app_id" in
            *"($APPLE_TEAM_ID)") ;;
            *)
              echo "Developer ID Application is not for team $APPLE_TEAM_ID."
              echo "$app_id"
              exit 1
              ;;
          esac
          api_key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | tr -d '[:space:]' | base64 -D > "$api_key"
          chmod 600 "$api_key"
          export DEVELOPER_ID_APPLICATION="$app_id"
          export DEVELOPER_ID_INSTALLER="$installer_id"
          export APPLE_API_KEY_PATH="$api_key"
          bash plugin/packaging/macos/package.sh

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: Lorenz-${{ steps.version.outputs.value }}-macOS
          path: dist/Lorenz-${{ steps.version.outputs.value }}-macOS.pkg
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME#v}"
          if [[ ! "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ref="1.0.0"
          fi
          echo "value=$ref" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.0.3485.44"
          $pkgDir = Join-Path $env:USERPROFILE "AppData\Local\PackageManagement\NuGet\Packages\Microsoft.Web.WebView2.$version"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "Microsoft.Web.WebView2.$version.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$version" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $pkgDir -Force
          foreach ($file in @(
            "build\native\include\WebView2.h",
            "build\native\x64\WebView2LoaderStatic.lib"
          )) {
            if (-not (Test-Path (Join-Path $pkgDir $file))) { throw "WebView2 package is missing $file" }
          }

      - name: Build VST3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S plugin -B plugin/build -G "Visual Studio 18 2026" -A x64 -DLORENZ_VERSION="${{ steps.version.outputs.value }}"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build plugin/build --config Release --target LorenzMIDI_VST3 --target lorenz_engine_test
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          $test = Get-ChildItem plugin\build -Recurse -Filter lorenz_engine_test.exe | Select-Object -First 1
          if (-not $test) { throw "lorenz_engine_test.exe was not built" }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw "engine test failed" }

      - name: Package unsigned installer
        shell: pwsh
        env:
          LORENZ_VERSION: ${{ steps.version.outputs.value }}
        run: |
          & plugin\packaging\windows\package.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Lorenz-${{ steps.version.outputs.value }}-Windows
          path: dist/Lorenz-${{ steps.version.outputs.value }}-Windows.exe
          if-no-files-found: error

  release:
    name: Publish tag
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum Lorenz-*.pkg Lorenz-*.exe | tee SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/Lorenz-*.pkg
            dist/Lorenz-*.exe
            dist/SHA256SUMS
          body: |
            Installers for Lorenz ${{ github.ref_name }}.

            The macOS package is signed and notarized. It installs the Audio Unit and the VST3. The Windows package is unsigned. It installs the VST3. Source for this build is this tag, built with JUCE 9.0.5.

            Lorenz is licensed under the AGPL. See plugin/LICENSE.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
